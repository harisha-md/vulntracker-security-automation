
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulntracker-api
  labels:
    app: vulntracker-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulntracker-api
  template:
    metadata:
      labels:
        app: vulntracker-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vulntracker-api
          image: vulntracker-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: vulntracker-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vulntracker-api
spec:
  type: ClusterIP
  selector:
    app: vulntracker-api
  ports:
    - name: http
      port: 8000
      targetPort: http
